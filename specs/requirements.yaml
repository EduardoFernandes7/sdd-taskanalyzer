# Matriz de rastreabilidade: regra de negocio da spec v1.1 -> teste que a verifica.
# Fonte das regras: specs/task_analyzer_spec.md, secao 1.3.5.
projeto: sdd-taskanalyzer
especificacao: "1.1"
requisitos:
  - id: RN-01
    descricao: Somente tarefas concluidas entram no tempo medio e na taxa de atraso.
    testes: [test_metricas_com_tarefas_validas]
  - id: RN-02
    descricao: Tempo de conclusao em horas entre data_criacao e data_conclusao.
    testes: [test_metricas_com_tarefas_validas, test_tempo_medio_por_prioridade]
  - id: RN-03
    descricao: Atraso somente quando a conclusao e estritamente posterior ao prazo.
    testes: [test_conclusao_exatamente_no_prazo, test_todas_concluidas_com_atraso]
  - id: RN-04
    descricao: Tarefas canceladas contam apenas em total_tarefas.
    testes: [test_metricas_com_tarefas_validas]
  - id: RN-05
    descricao: Datas devem ter fuso horario (timezone-aware, UTC).
    testes: [test_entrada_invalida_levanta_erro]
  - id: RN-06
    descricao: Arredondamento de duas casas apenas na montagem do retorno.
    testes: [test_metricas_com_tarefas_validas]
  - id: RN-07
    descricao: Prioridade sem tarefas concluidas retorna 0.0 sem excecao.
    testes: [test_apenas_pendentes_retorna_medias_zero, test_tempo_medio_por_prioridade]
  - id: RN-08
    descricao: Sem tarefas concluidas, metricas globais valem 0.0 sem excecao.
    testes: [test_apenas_pendentes_retorna_medias_zero]
  - id: RN-09
    descricao: Lista vazia e entrada valida e retorna metricas zeradas.
    testes: [test_lista_vazia_retorna_zeros]
  - id: RN-10
    descricao: A ordem das tarefas nao influencia o resultado.
    testes: [test_ordem_das_tarefas_nao_influencia]
  - id: RN-11
    descricao: Entrada que nao e lista, ou ids repetidos, levantam TaskValidationError.
    testes: [test_entrada_nao_e_lista, test_ids_duplicados]
  - id: CT-01
    descricao: Datas inconsistentes (conclusao anterior a criacao) levantam TaskValidationError.
    testes: [test_data_conclusao_anterior_a_criacao]
  - id: CT-02
    descricao: A estrutura do retorno e fixa, sem chaves extras.
    testes: [test_estrutura_do_retorno_e_fixa]